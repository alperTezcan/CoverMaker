[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "covermaker"
version = "0.2.0"
description = "A tiny multitrack music-cover video assembler"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.8,<7",
    "numpy>=1.26,<3",
]

[project.scripts]
covermaker = "covermaker.app:main"

[tool.setuptools.packages.find]
include = ["covermaker*"]
